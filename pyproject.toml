[project]
name = "ai-content-creator"
version = "0.1.0"
description = "AI-powered LinkedIn content creation and knowledge assistant for AI/GenAI professionals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=2.9.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "openai>=1.50.0",
    "qdrant-client>=1.9.0",
    "tavily-python>=0.3.0",
    "tweepy>=4.14.0",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.0",
    "networkx>=3.3.0",
    "ragas>=0.2.0",
    "datasets>=2.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.3.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.19.0",
    "numpy>=1.26.0",
    "nltk>=3.8.0",
    "plotly>=5.0.0",
    "rapidfuzz>=3.14.3",
    "rank-bm25>=0.2.2",
    "langchain-cohere>=0.4.4",
    "cohere>=5.12.0",
    "langchain-experimental>=0.3.4",
    "unstructured>=0.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
